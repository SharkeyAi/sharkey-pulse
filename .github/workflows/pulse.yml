name: Sharkey Pulse
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '0 11 * * *'
    - cron: '0 3 * * *'
jobs:
  alert:
    if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Fire Alert
        run: curl -s "https://execucore-pulse.wsharkey.workers.dev/?type=alert"
  briefing:
    if: github.event.schedule == '0 11 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Fire Briefing
        run: curl -s "https://execucore-pulse.wsharkey.workers.dev/?type=briefing"
  recap:
    if: github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Fire Recap
        run: curl -s "https://execucore-pulse.wsharkey.workers.dev/?type=recap"
